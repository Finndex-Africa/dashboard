[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"

# Security headers are defined once in next.config.js so they apply on every host
# (Netlify, self-hosted via server.js, local). Duplicating them here caused the two
# sources to drift, so this file no longer sets them.
#
# X-XSS-Protection was removed deliberately: the legacy auditor it enables is gone
# from modern browsers and its filter introduced its own injection bugs. The CSP in
# next.config.js replaces it.
